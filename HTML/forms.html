<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms </title>
</head>
<body>
    <form>
        <label for="name" >Name</label>
        <input type="text" required placeholder="Hello" id ="name">
        <br>
        <label 
        for="email">Email</label>
        <input type="email" name="zaid" required id="email" minlength="2">
        <br>
        <label 
        for="password">Password</label>
        <input type="password" required value="zaid" id="password" minlength="12">

        <div>
            <!-- <input type="submit" value="Submit"> -->
             <button type="submit">Submit</button>
        </div>

        
    </form>
</body>
</html>
