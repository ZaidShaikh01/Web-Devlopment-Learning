
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Challenge</title>
</head>
<body>
    <h1>Apartment Search</h1>
    <form>

        <label for="location">Location</label>
        <input type="text" name="Location" id="location" placeholder="Enter Location">
        <br>
        <label for="montly-input">Montly input</label>
        <input type="range" name="range" id="montly-input" min="2000" max="10000">
        <br>
        <label for="bedroom">Number of bedrooms</label>
        <input type="number" name="bedroom" id="bedroom"min="1" max="10"  placeholder="Enter NumbersOfBedroom" >
        <br>
        
    </form>
    <!-- checkbox -->
     
     <form >
        <label for="pets"> Pets allowed </label>
        <input type="checkbox" name="pets" id="pets"> 2
        <input type="checkbox" name="pets" id="3"> 3
        <input type="checkbox" name="pets" id="4"> 4
        <input type="checkbox" name="pets" id="5"> 5
        
     </form>
     <hr>
 <label for="dataAvailable">Faviorate Programming Languages</label>
    <input list="languages" id="dataAvailable" name="dataAvailable">
    <datalist id="languages">
        <option value="pan"></option>
        <option value="adhar"></option>
        <option value="passport"></option>
        
    </datalist>
   
    
</body>
</html>
