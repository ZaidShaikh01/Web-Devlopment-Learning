<body>
    <div class="wrapper">
        <header>
        <ul>
            <li class="logo"><img src="/Landing-Form-Mini-Project/images/logo.svg" alt="Bono-PNG"></li>
            <li class="space-in-between"></li>
            <li class="gmail">
                
                <i class="fas fa-envelope"></i> szaid5146@gmail.com</li>
            <li class="contact-no">
                <i class="fas fa-phone"></i>
                678123</li>
            <li class="twitter-logo">

    <main>
        <div class="input-contents">
            <form>
                <label for="name">Name</label>
                <textarea name="name" id="name"></textarea>

                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="written-content">
            <h1>Coming Soon For Every Developer</h1>

                Our new Bono web app will change the way you think about content managment and will allow you to focus on what's really important. Use the contact form to send us your thoughts

    </div>
